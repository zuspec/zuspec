
package:
  name: zuspec

  dep-sets:
  - name: default-dev
    deps:
    - name: zuspec-dataclasses
      url: https://github.com/zuspec/zuspec-dataclasses.git
    - name: zuspec-cli
      url: https://github.com/zuspec/zuspec-cli.git
    - name: zuspec-be-sw
      url: https://github.com/zuspec/zuspec-be-sw.git
    - name: zuspec-be-sv
      url: https://github.com/zuspec/zuspec-be-sv.git
    - name: zuspec-be-fv
      url: https://github.com/zuspec/zuspec-be-fv.git
    - name: zuspec-be-trace
      url: https://github.com/zuspec/zuspec-be-trace.git
    - name: zuspec-be-hdlsim
      url: https://github.com/zuspec/zuspec-be-hdlsim.git
    - name: pssparser
      url: https://github.com/psstools/pssparser.git
    - name: zuspec-fe-pss
      url: https://github.com/zuspec/zuspec-fe-pss.git
    - name: zuspec-fe-sv
      url: https://github.com/zuspec/zuspec-fe-sv.git
    - name: zuspec-ir-core
      url: https://github.com/zuspec/zuspec-ir-core.git
    - name: zuspec-solver
      url: https://github.com/zuspec/zuspec-solver.git
    - name: zuspec-synth
      url: https://github.com/zuspec/zuspec-synth.git
    - name: yosys
      src: gh-rls
      url: https://github.com/edapack/yosys-bin
      cache: true
    - name: build
      src: pypi
    - name: uvloop
      src: pypi

  

