
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Use importlib mode to avoid conflicts with duplicate test filenames
addopts = --import-mode=importlib
asyncio_mode = strict
testpaths =
  tests/unit
  packages/zuspec-dataclasses/tests/unit
  packages/zuspec-be-sw/tests/unit
  packages/zuspec-be-sv/tests/unit
  packages/zuspec-fe-pss/tests/python
